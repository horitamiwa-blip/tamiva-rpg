name: Generate note comments

on:
  push:
    paths:
      - 'notes/*.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate companion comments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/generate-comments.mjs

      - name: Commit results
        run: |
          git config user.name "notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes/manifest.json notes/comments
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update note comments"
            git push origin HEAD:${{ github.ref_name }}
          fi
