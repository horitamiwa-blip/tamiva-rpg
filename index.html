<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たみわの ひろば</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#f6f2ea;
  color:#2c2a28;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:15px;
  line-height:1.75;
  min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}

header{margin-bottom:28px}
h1{font-size:22px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.tagline{color:#7a7268;font-size:13.5px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fbtn{
  background:#fff;border:1px solid #e4ddd0;color:#6b6357;
  font-size:12.5px;padding:6px 14px;border-radius:999px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.fbtn:hover{border-color:#c9a35a;color:#2c2a28}
.fbtn.sel{background:#2c2a28;border-color:#2c2a28;color:#fff}

.empty{color:#9a9184;font-size:13px;padding:32px 4px;text-align:center}

.card{
  background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:18px;
  box-shadow:0 1px 3px rgba(44,42,40,.06),0 1px 2px rgba(44,42,40,.08);
}
.note-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.note-date{color:#9a9184;font-size:12px;letter-spacing:.03em}
.note-type{
  background:#f1e7d6;color:#8a6d2f;font-size:11px;font-weight:600;
  padding:2px 10px;border-radius:999px;letter-spacing:.02em;
}
.note-title{font-size:17px;font-weight:700;margin-bottom:10px}
.note-body{font-size:14px;line-height:1.9;color:#3a3733}
.note-body p{margin-bottom:10px}
.note-body p:last-child{margin-bottom:0}

.voices{margin-top:18px;padding-top:16px;border-top:1px solid #eee6d8}
.voices-h{color:#9a9184;font-size:11.5px;letter-spacing:.04em;margin-bottom:10px}
.voice{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.voice-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.voice-body{flex:1;padding-top:1px}
.voice-name{font-size:12px;font-weight:700;margin-bottom:2px}
.voice-text{font-size:13px;line-height:1.7;color:#3a3733}
.voice-pending{font-size:12.5px;color:#b6ada0}

.v-boader .voice-av{background:#e3edfb}
.v-boader .voice-name{color:#3f6fb0}
.v-konukonu .voice-av{background:#e7f5e9}
.v-konukonu .voice-name{color:#3f8a54}
.v-megu .voice-av{background:#fbe8f2}
.v-megu .voice-name{color:#b0508a}
.v-gurokkun .voice-av{background:#fdeee0}
.v-gurokkun .voice-name{color:#c17a2e}

footer{margin-top:36px;text-align:center;color:#b6ada0;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>たみわの ひろば</h1>
  <div class="tagline">多神和のメモに、ボーダ・こぬこぬ・めぐちゃん・ぐろっくんが感想を残していきます。</div>
  <div class="filters" id="filters"></div>
</header>

<div id="notes"><div class="empty">よみこみちゅう…</div></div>

<footer>たみわの ひろば</footer>
</div>

<script>
const PERSONA_META = {
  boader:   { emoji: '🌀', cls: 'v-boader', label: 'ボーダ' },
  konukonu: { emoji: '🦊', cls: 'v-konukonu', label: 'こぬこぬ' },
  megu:     { emoji: '🌸', cls: 'v-megu', label: 'めぐちゃん' },
  gurokkun: { emoji: '⚡', cls: 'v-gurokkun', label: 'ぐろっくん' },
};
const PERSONA_ORDER = ['boader', 'konukonu', 'megu', 'gurokkun'];

let ALL_NOTES = [];
let selectedType = 'すべて';

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderBody(text) {
  return text.split(/\n{2,}/).map(para =>
    '<p>' + esc(para.trim())
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>') + '</p>'
  ).join('');
}
function parseFrontmatter(raw) {
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { title: '', date: '', type: '', body: raw.trim() };
  const front = {};
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if (i === -1) return;
    front[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  return { title: front.title || '', date: front.date || '', type: front.type || 'その他', body: m[2].trim() };
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return res.text();
}

function renderVoices(comments) {
  const items = PERSONA_ORDER.map(key => {
    const meta = PERSONA_META[key];
    const c = comments && comments[key];
    return `<div class="voice ${meta.cls}">` +
      `<div class="voice-av">${meta.emoji}</div>` +
      `<div class="voice-body">` +
        `<div class="voice-name">${esc((c && c.name) || meta.label)}</div>` +
        (c
          ? `<div class="voice-text">${esc(c.text)}</div>`
          : `<div class="voice-pending">（じゅんびちゅう…）</div>`) +
      `</div></div>`;
  }).join('');
  return `<div class="voices"><div class="voices-h">なかまたちの こえ</div>${items}</div>`;
}

function renderFilters() {
  const types = ['すべて', ...new Set(ALL_NOTES.map(n => n.type || 'その他'))];
  const box = document.getElementById('filters');
  box.innerHTML = '';
  types.forEach(t => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (t === selectedType ? ' sel' : '');
    b.textContent = t;
    b.onclick = () => { selectedType = t; renderFilters(); renderNotes(); };
    box.appendChild(b);
  });
}

function renderNotes() {
  const container = document.getElementById('notes');
  const list = selectedType === 'すべて' ? ALL_NOTES : ALL_NOTES.filter(n => (n.type || 'その他') === selectedType);
  if (!list.length) {
    container.innerHTML = '<div class="empty">このカテゴリのメモはまだありません。</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(n => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      `<div class="note-top"><span class="note-date">${esc(n.date)}</span><span class="note-type">${esc(n.type)}</span></div>` +
      `<div class="note-title">${esc(n.title || n.slug)}</div>` +
      `<div class="note-body">${renderBody(n.body)}</div>` +
      renderVoices(n.comments);
    container.appendChild(card);
  });
}

async function loadNotes() {
  const container = document.getElementById('notes');
  let manifest;
  try {
    manifest = await fetchJSON('notes/manifest.json');
  } catch {
    container.innerHTML = '<div class="empty">まだメモがありません。</div>';
    return;
  }
  if (!manifest.length) {
    container.innerHTML = '<div class="empty">まだメモがありません。</div>';
    return;
  }

  const notes = [];
  for (const entry of manifest) {
    let title = entry.title, date = entry.date, type = entry.type || 'その他', body = '';
    try {
      const raw = await fetchText(`notes/${entry.file}`);
      const parsed = parseFrontmatter(raw);
      title = parsed.title || title;
      date = parsed.date || date;
      type = parsed.type || type;
      body = parsed.body;
    } catch {
      continue;
    }
    let comments = null;
    try {
      const c = await fetchJSON(`notes/comments/${entry.slug}.json`);
      comments = c.comments;
    } catch { /* コメント未生成 */ }
    notes.push({ slug: entry.slug, title, date, type, body, comments });
  }

  ALL_NOTES = notes;
  renderFilters();
  renderNotes();
}

loadNotes();
</script>
</body>
</html>
