<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たみわの さんぽメモ</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000820;color:#fff;font-family:'Courier New','MS Gothic',monospace;font-size:14px;line-height:1.7;padding:12px;min-height:100vh}
.win{background:#00093a;border:4px solid #fff;box-shadow:inset 0 0 0 2px #000820,4px 4px 0 #000;padding:14px 16px;margin-bottom:12px}
.wt{color:#ffff00;font-size:11px;letter-spacing:.12em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #ffffff22}
.nav{text-align:right;margin-bottom:10px}
.nav a{color:#6688cc;font-size:11px;text-decoration:none;border:1px solid #334466;padding:3px 9px}
.nav a:hover{color:#fff;border-color:#8899ff}
.note-date{color:#aabbff;font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.note-title{color:#ffff00;font-size:15px;font-weight:bold;margin-bottom:10px}
.note-body{font-size:13px;line-height:1.9;margin-bottom:12px;color:#e6ecff}
.note-body p{margin-bottom:8px}
.voices-h{color:#6688cc;font-size:10px;letter-spacing:.1em;margin:10px 0 6px;padding-top:8px;border-top:1px solid #ffffff1a}
.voice{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
.voice-av{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.voice-body{flex:1}
.voice-name{font-size:11px;font-weight:bold;margin-bottom:2px}
.voice-text{font-size:12.5px;line-height:1.7;color:#dfe6ff}
.voice-pending{font-size:12px;color:#334466}
.v-boader .voice-name{color:#44aaff}
.v-konukonu .voice-name{color:#66ee88}
.v-gurokkun .voice-name{color:#ff9944}
.empty{color:#556688;font-size:12px;padding:20px 4px;text-align:center}
</style>
</head>
<body>

<div class="nav"><a href="index.html">🏠 ダッシュボードへ</a></div>
<div class="win">
  <div class="wt">🚶 たみわの さんぽメモ</div>
  <div style="color:#aabbff;font-size:12px">ボーダ・こぬこぬ・ぐろっくんが かんそうを のこしていきます。</div>
</div>

<div id="notes"><div class="empty">よみこみちゅう…</div></div>

<script>
const PERSONA_META = {
  boader:   { emoji: '🌀', cls: 'v-boader', label: 'ボーダ' },
  konukonu: { emoji: '🦊', cls: 'v-konukonu', label: 'こぬこぬ' },
  gurokkun: { emoji: '⚡', cls: 'v-gurokkun', label: 'ぐろっくん' },
};
const PERSONA_ORDER = ['boader', 'konukonu', 'gurokkun'];

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderBody(text) {
  return text.split(/\n{2,}/).map(para =>
    '<p>' + esc(para.trim())
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>') + '</p>'
  ).join('');
}
function parseFrontmatter(raw) {
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { title: '', date: '', body: raw.trim() };
  const front = {};
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if (i === -1) return;
    front[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  return { title: front.title || '', date: front.date || '', body: m[2].trim() };
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return res.text();
}

function renderVoices(comments) {
  const items = PERSONA_ORDER.map(key => {
    const meta = PERSONA_META[key];
    const c = comments && comments[key];
    return `<div class="voice ${meta.cls}">` +
      `<div class="voice-av">${meta.emoji}</div>` +
      `<div class="voice-body">` +
        `<div class="voice-name">${esc((c && c.name) || meta.label)}</div>` +
        (c
          ? `<div class="voice-text">${esc(c.text)}</div>`
          : `<div class="voice-pending">（じゅんびちゅう…）</div>`) +
      `</div></div>`;
  }).join('');
  return `<div class="voices-h">💬 なかまたちの こえ</div>${items}`;
}

async function loadNotes() {
  const container = document.getElementById('notes');
  let manifest;
  try {
    manifest = await fetchJSON('walks/manifest.json');
  } catch {
    container.innerHTML = '<div class="empty">まだメモがありません。</div>';
    return;
  }
  if (!manifest.length) {
    container.innerHTML = '<div class="empty">まだメモがありません。</div>';
    return;
  }

  container.innerHTML = '';
  for (const entry of manifest) {
    let title = entry.title, date = entry.date, body = '';
    try {
      const raw = await fetchText(`walks/${entry.file}`);
      const parsed = parseFrontmatter(raw);
      title = parsed.title || title;
      date = parsed.date || date;
      body = parsed.body;
    } catch {
      continue;
    }
    let comments = null;
    try {
      const c = await fetchJSON(`walks/comments/${entry.slug}.json`);
      comments = c.comments;
    } catch { /* コメント未生成 */ }

    const win = document.createElement('div');
    win.className = 'win';
    win.innerHTML =
      `<div class="note-date">${esc(date)}</div>` +
      `<div class="note-title">${esc(title || entry.slug)}</div>` +
      `<div class="note-body">${renderBody(body)}</div>` +
      renderVoices(comments);
    container.appendChild(win);
  }
}

loadNotes();
</script>
</body>
</html>
